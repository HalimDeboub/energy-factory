version: "3.8"

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma_db
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    volumes:
      - chroma_data:/chroma/chroma_db
    restart: unless-stopped

  chroma-dashboard:
    image: ghcr.io/chroma-core/chroma-dashboard:latest
    ports:
      - "3000:3000"
    environment:
      - CHROMA_SERVER_HOST=http://chromadb:8000
    depends_on:
      - chromadb
    restart: unless-stopped

volumes:
  chroma_data:
